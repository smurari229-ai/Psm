name: DukaanBoost quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "build/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free tests
        run: npm test
